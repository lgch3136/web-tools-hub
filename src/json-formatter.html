  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
    const input = document.getElementById('jsonInput');
    const preview = document.getElementById('jsonPreview');
    const errMsg = document.getElementById('jsonError');
    const status = document.getElementById('jsonStatus');
    const stats = document.getElementById('jsonStats');
    function syntaxHighlight(json) {
      json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return json.replace(/("(?:[^"\\]|\\.)*")\s*:/g, '<span class="key">$1</span><span class="colon">:</span>')
        .replace(/("(?:[^"\\]|\\.)*")/g, (m, p1) => m.includes('class="key"') ? m : '<span class="string">' + p1 + '</span>')
        .replace(/\b(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)\b/g, '<span class="number">$1</span>')
        .replace(/\b(true|false)\b/g, '<span class="boolean">$1</span>')
        .replace(/\bnull\b/g, '<span class="null">null</span>')
        .replace(/([\[\]{}])/g, '<span class="bracket">$1</span>')
        .replace(/,/g, '<span class="comma">,</span>');
    }
    function countKeys(obj) { if (typeof obj !== 'object' || obj === null) return 0; let c = 0; for (const k in obj) { c++; if (typeof obj[k] === 'object' && obj[k] !== null) c += countKeys(obj[k]); } return c; }
    function showResult(valid, formatted, errorText) {
      if (valid) { input.value = formatted; preview.innerHTML = syntaxHighlight(formatted); preview.style.display = 'block'; errMsg.style.display = 'none'; input.classList.remove('error'); status.textContent = '✅ JSON 有效'; status.className = 'json-status ok'; try { const o = JSON.parse(formatted); const bytes = new TextEncoder().encode(formatted).length; stats.textContent = formatted.split('\n').length + ' 行 · ' + bytes.toLocaleString() + ' 字节 · ' + countKeys(o) + ' 个键'; } catch(e) { stats.textContent = ''; } }
      else { preview.style.display = 'none'; errMsg.textContent = '❌ ' + errorText; errMsg.style.display = 'block'; input.classList.add('error'); status.textContent = '❌ JSON 无效'; status.className = 'json-status err'; stats.textContent = ''; }
    }
    function formatJSON() { const raw = input.value.trim(); if (!raw) { showResult(false, raw, '请输入 JSON 数据'); return; } try { const obj = JSON.parse(raw); showResult(true, JSON.stringify(obj, null, 2), ''); } catch (e) { try { const fixed = raw.replace(/'/g, '"'); const obj = JSON.parse(fixed); showResult(true, JSON.stringify(obj, null, 2), ''); return; } catch(e2) {} showResult(false, raw, e.message); } }
    function minifyJSON() { const raw = input.value.trim(); if (!raw) return; try { const obj = JSON.parse(raw); input.value = JSON.stringify(obj); preview.innerHTML = syntaxHighlight(input.value); preview.style.display = 'block'; errMsg.style.display = 'none'; input.classList.remove('error'); status.textContent = '✅ 已压缩'; status.className = 'json-status ok'; const bytes = new TextEncoder().encode(input.value).length; stats.textContent = '1 行 · ' + bytes.toLocaleString() + ' 字节'; } catch (e) { showResult(false, raw, e.message); } }
    function escapeJSON() { input.value = JSON.stringify(input.value).slice(1, -1); formatJSON(); }
    function unescapeJSON() { try { const unescaped = JSON.parse('"' + input.value.replace(/"/g, '\\"') + '"'); input.value = unescaped; formatJSON(); } catch(e) { showResult(false, input.value, '反转义失败: ' + e.message); } }
    function clearJSON() { input.value = ''; preview.style.display = 'none'; errMsg.style.display = 'none'; input.classList.remove('error'); status.textContent = '就绪'; status.className = 'json-status'; stats.textContent = ''; }
    function loadSample() { input.value = JSON.stringify({ website: '在线工具集', url: 'https://web-tools-hub-three.vercel.app', tools: [{ name: 'MD ↔ HTML 转换器', category: 'format' }, { name: '汇率换算', category: 'finance' }, { name: '密码生成器', category: 'security' }, { name: '时间戳转换', category: 'developer' }, { name: 'JSON 格式化', category: 'developer' }], version: '1.0.0', features: { free: true, localProcessing: true, adsSupported: true } }, null, 2); formatJSON(); }
    function switchTab(tab) { document.getElementById('tabEditor').classList.toggle('active', tab === 'editor'); document.getElementById('tabPreview').classList.toggle('active', tab === 'preview'); input.style.display = tab === 'editor' ? '' : 'none'; preview.style.display = tab === 'preview' ? '' : 'none'; if (tab === 'preview') formatJSON(); }
    input.addEventListener('input', () => { input.classList.remove('error'); errMsg.style.display = 'none'; status.textContent = '已修改'; status.className = 'json-status'; });
    input.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); formatJSON(); } });
    formatJSON();
  </script>
