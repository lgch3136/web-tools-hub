    function myersDiff(a,b){const n=a.length,m=b.length;const max=n+m;const V=new Array(2*max+1);const trace=[];for(let d=0;d<=max;d++){trace.push([...V]);for(let k=-d;k<=d;k+=2){const idx=k+max;let x;if(k===-d||(k!==d&&V[idx-1]<V[idx+1]))x=V[idx+1];else x=V[idx-1]+1;let y=x-k;while(x<n&&y<m&&a[x]===b[y]){x++;y++}V[idx]=x;if(x>=n&&y>=m){trace.push([...V]);return backtrack(trace,n,m,max)}}}return backtrack(trace,n,m,max)}
    function backtrack(trace,n,m,max){const ops=[];let x=n,y=m;for(let d=trace.length-1;d>=0;d--){const V=trace[d];if(!V)continue;const k=x-y;const idx=k+max;let prevK;if(k===-d||(k!==d&&V[idx-1]<V[idx+1]))prevK=k+1;else prevK=k-1;const prevX=V[prevK+max];const prevY=prevX-prevK;while(x>prevX&&y>prevY){ops.push({type:'equal',aIndex:x-1,bIndex:y-1});x--;y--}if(x>prevX){ops.push({type:'delete',aIndex:x-1});x--}else if(y>prevY){ops.push({type:'insert',bIndex:y-1});y--}}return ops.reverse()}
    function runDiff(){let a=document.getElementById('diffA').value;let b=document.getElementById('diffB').value;const s=document.getElementById('diffStatus');const r=document.getElementById('diffResult');if(!a&&!b){s.textContent='⚠️ 请在两侧输入要对比的文本';r.classList.remove('show');return}const cs=document.getElementById('diffCaseSensitive').checked;const tr=document.getElementById('diffTrim').checked;let la=a.split('\n'),lb=b.split('\n');if(!cs){la=la.map(l=>l.toLowerCase());lb=lb.map(l=>l.toLowerCase())}if(tr){la=la.map(l=>l.trim());lb=lb.map(l=>l.trim())}const ra=a.split('\n'),rb=b.split('\n');const ops=myersDiff(la,lb);const rA=document.getElementById('diffResultA'),rB=document.getElementById('diffResultB');rA.innerHTML='';rB.innerHTML='';let aL=0,bL=0,add=0,del=0,eq=0;const ml=(t,type,num)=>{const d=document.createElement('div');d.className='diff-line diff-line-'+type;const n=document.createElement('span');n.className='diff-line-num';n.textContent=num!==null?num:'';const c=document.createElement('span');c.className='diff-line-content';c.textContent=t||' ';d.appendChild(n);d.appendChild(c);return d};for(const op of ops){if(op.type==='equal'){eq++;rA.appendChild(ml(ra[op.aIndex],'equal',++aL));rB.appendChild(ml(rb[op.bIndex],'equal',++bL))}else if(op.type==='delete'){del++;rA.appendChild(ml(ra[op.aIndex],'removed',++aL));rB.appendChild(ml('','empty',null))}else{add++;rA.appendChild(ml('','empty',null));rB.appendChild(ml(rb[op.bIndex],'added',++bL))}}document.getElementById('diffStatsA').textContent='+'+add+' -'+del+' '+eq+'行相同';document.getElementById('diffStatsB').textContent='+'+add+' -'+del+' '+eq+'行相同';r.classList.add('show');if(add===0&&del===0)s.textContent='✅ 两段文本完全相同 ('+eq+' 行)';else s.textContent='✅ 发现 '+del+' 处删除, '+add+' 处新增 ('+eq+' 行相同)'}
    function clearDiff(){document.getElementById('diffA').value='';document.getElementById('diffB').value='';document.getElementById('diffResult').classList.remove('show');document.getElementById('diffResultA').innerHTML='';document.getElementById('diffResultB').innerHTML='';document.getElementById('diffStatus').textContent=''}
    function loadSamples(){document.getElementById('diffA').value='function hello(name) {\n  console.log("Hello, " + name);\n  return true;\n}\n\nconst user = "Alice";\nhello(user);';document.getElementById('diffB').value='function greet(name) {\n  console.log(`Hello, ${name}!`);\n  return true;\n}\n\nconst user = "Bob";\ngreet(user);\nconsole.log("Done");';runDiff()}
