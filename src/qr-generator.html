    .qr-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}

    @media(max-width:480px){.qr-card{padding:20px 16px}.qr-input-row{flex-direction:column}}

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
    let currentCanvas = null;
    function getLevel() { const map = {L:QRCode.CorrectLevel.L,M:QRCode.CorrectLevel.M,Q:QRCode.CorrectLevel.Q,H:QRCode.CorrectLevel.H}; return map[document.getElementById('qrLevel').value] || QRCode.CorrectLevel.M; }
    function generateQR() {
      const text = document.getElementById('qrInput').value.trim();
      if (!text) { document.getElementById('qrStatus').textContent = '⚠️ 请输入内容'; return; }
      const size = parseInt(document.getElementById('qrSize').value);
      const fg = document.getElementById('qrFg').value;
      const bg = document.getElementById('qrBg').value;
      const canvas = document.getElementById('qrCanvas');
      canvas.width = size; canvas.height = size;
      try {
        QRCode.toCanvas(canvas, text, { width: size, margin: 2, color: { dark: fg, light: bg }, errorCorrectionLevel: getLevel() }, function(err) {
          if (err) { document.getElementById('qrStatus').textContent = '❌ 生成失败: ' + err.message; return; }
          currentCanvas = canvas;
          document.getElementById('qrStatus').textContent = '✅ 二维码生成成功 · 内容: ' + text.substring(0, 50) + (text.length > 50 ? '…' : '');
        });
      } catch(e) { document.getElementById('qrStatus').textContent = '❌ ' + e.message; }
    }
    function downloadQR() { if (!currentCanvas) return; const a = document.createElement('a'); a.download = 'qrcode.png'; a.href = currentCanvas.toDataURL('image/png'); a.click(); document.getElementById('qrStatus').textContent = '✅ 已下载 PNG'; }
    function downloadSVG() {
      const text = document.getElementById('qrInput').value.trim(); if (!text) return;
      const fg = document.getElementById('qrFg').value; const bg = document.getElementById('qrBg').value;
      const qr = QRCode.create(text, { errorCorrectionLevel: getLevel() });
      const cellSize = 6; const margin = 2; const size = (qr.modules.length + margin * 2) * cellSize;
      let svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">';
      svg += '<rect width="' + size + '" height="' + size + '" fill="' + bg + '" rx="4"/>';
      for (let r = 0; r < qr.modules.length; r++) for (let c = 0; c < qr.modules.length; c++) if (qr.modules[r][c]) svg += '<rect x="' + ((c + margin) * cellSize) + '" y="' + ((r + margin) * cellSize) + '" width="' + cellSize + '" height="' + cellSize + '" fill="' + fg + '"/>';
      svg += '</svg>';
      const blob = new Blob([svg], { type: 'image/svg+xml' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.download = 'qrcode.svg'; a.href = url; a.click(); URL.revokeObjectURL(url);
      document.getElementById('qrStatus').textContent = '✅ 已下载 SVG';
    }
    function setPreset(val) { document.getElementById('qrInput').value = val; generateQR(); }
    document.getElementById('qrInput').addEventListener('keydown', e => { if (e.key === 'Enter') generateQR(); });
    ['qrSize','qrFg','qrBg','qrLevel'].forEach(id => { document.getElementById(id).addEventListener('change', generateQR); });
    generateQR();
  </script>
